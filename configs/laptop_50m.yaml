model:
  vocab_size: 50257
  d_model: 512
  num_layers: 15
  num_persistent_tokens: 16
  mlp_hidden_dim: 1344
  dropout: 0.0
  attention:
    window_size: 1024
    num_heads: 8
    num_kv_heads: 8
    head_dim: 64
  memory:
    key_dim: 64
    value_dim: 64
    hidden_dim: 256
    num_mlp_layers: 2
    momentum_init: 2.0
    forget_init: -2.0
    lr_init: -2.0
    chunk_size: 256

train:
  backend: cpu
  base_micro_batch: 2
  base_grad_accum: 1
  lr: 0.0008
  weight_decay: 0.1
  warmup_steps: 40
  max_steps: 420
  seq_len: 256
  checkpoint_every: 1000
  checkpoint_dir: checkpoints/laptop_50m
  seed: 0

curriculum:
  - min_step: 0
    context_len: 256
    haystack_filler_tokens: 200
    needle_depth_bins: 3
